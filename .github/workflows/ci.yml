name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The kernel test loads sibling checkouts (../valet-core, ../valet-agent, ../valet-contextmanager),
# so this repo goes into a subfolder of the workspace next to them. valet-agent uses its
# settings-blocks branch (wake on part types) until that lands on main.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: valet-exec
    steps:
      - uses: actions/checkout@v4
        with:
          path: valet-exec
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-core
          path: valet-core
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-agent
          ref: settings-blocks
          path: valet-agent
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-contextmanager
          path: valet-contextmanager
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: valet-core
      - run: bun install --frozen-lockfile
        working-directory: valet-agent
      - run: bun install --frozen-lockfile
        working-directory: valet-contextmanager
      - run: bun test
