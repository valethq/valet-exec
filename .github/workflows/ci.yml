name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The kernel test loads sibling checkouts (../valet-core, ../valet-agent, ../valet-contextmanager),
# so this repo goes into a subfolder of the workspace next to them.
# Sibling ACL branches are still unmerged, so pin their current heads for the kernel test; @valethq/sdk comes from npm 0.6.0.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: valet-exec
    steps:
      - uses: actions/checkout@v4
        with:
          path: valet-exec
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-core
          path: valet-core
          ref: 737cb0ab2eb406855677712a7ef8a2411922cd32
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-agent
          path: valet-agent
          ref: ccf9088f46a2e3aa58ad56416ce73dea6201b677
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-contextmanager
          path: valet-contextmanager
          ref: e436e6eb3569db522204bc04f0e82798bcc513f7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: valet-core
      - run: bun install --frozen-lockfile
        working-directory: valet-agent
      - run: bun install --frozen-lockfile
        working-directory: valet-contextmanager
      - run: bun test
