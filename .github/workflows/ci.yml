name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The kernel test loads sibling checkouts (../valet-core, ../valet-agent, ../valet-contextmanager),
# so this repo goes into a subfolder of the workspace next to them.
# The acl-transport refs and bun link below are temporary until the sibling ACL branches merge
# and @valethq/sdk 0.6.0 publishes; then drop ref:/link steps and use release pins.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: valet-exec
    steps:
      - uses: actions/checkout@v4
        with:
          path: valet-exec
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-core
          path: valet-core
          ref: acl-transport
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-agent
          path: valet-agent
          ref: acl-transport
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-contextmanager
          path: valet-contextmanager
          ref: acl-transport
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: valet-core
      - run: bun install --frozen-lockfile
        working-directory: valet-agent
      - run: bun install --frozen-lockfile
        working-directory: valet-contextmanager
      - name: Link local SDK for ACL branches
        working-directory: valet-core/packages/sdk
        run: bun link
      - name: Link local SDK into exec
        working-directory: valet-exec
        run: bun link @valethq/sdk
      - name: Link local SDK into agent
        working-directory: valet-agent
        run: bun link @valethq/sdk
      - name: Link local SDK into contextmanager
        working-directory: valet-contextmanager
        run: bun link @valethq/sdk
      - run: bun test
